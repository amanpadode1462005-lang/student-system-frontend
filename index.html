<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🎓 Student Information System</h1>
            <span class="text-indigo-200 text-sm">Connected to Live API</span>
            <span class="text-indigo-200 text-sm">cline servor working, MCP connection done</span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Form Section -->
        <section class="bg-white p-6 rounded-xl shadow-md lg:col-span-1">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-800">Add New Student</h2>
            <form id="student-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Student ID</label>
                    <input type="text" id="studentId" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Department</label>
                    <input type="text" id="department" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Semester</label>
                    <input type="text" id="semester" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contact Number</label>
                    <input type="text" id="contact" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex space-x-2">
                    <button type="submit" id="submit-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium">Save Student</button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Table Section -->
        <section class="bg-white p-6 rounded-xl shadow-md lg:col-span-2 overflow-hidden">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Student Directory</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider">
                            <th class="p-3">ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Dept</th>
                            <th class="p-3">Sem</th>
                            <th class="p-3">Contact</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <!-- Dynamic rows will load here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="max-w-7xl mx-auto px-4 pb-8 text-center text-sm text-gray-500">MCP Servor, backed by cline, working. Changes sucesfully made!</div>


    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'https://student-api-os9o.onrender.com/api/students';

        const studentForm = document.getElementById('student-form');
        const studentTableBody = document.getElementById('student-table-body');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const studentIdInput = document.getElementById('studentId');

        // Fetch and display students on load
        async function fetchStudents() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                // Extract the array from result.data based on your backend response structure
                if (result.success && Array.isArray(result.data)) {
                    renderTable(result.data);
                } else {
                    studentTableBody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No students found.</td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching students:', error);
            }
        }

        function renderTable(students) {
            studentTableBody.innerHTML = '';
            if (students.length === 0) {
                studentTableBody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No students found.</td></tr>`;
                return;
            }
            students.forEach(student => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-3 font-medium text-gray-900">${student.studentId}</td>
                    <td class="p-3">${student.name}</td>
                    <td class="p-3">${student.email}</td>
                    <td class="p-3">${student.department}</td>
                    <td class="p-3">${student.semester}</td>
                    <td class="p-3">${student.contact}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editStudent('${student.studentId}', '${student.name}', '${student.email}', '${student.department}', '${student.semester}', '${student.contact}')" class="text-blue-600 hover:underline">Edit</button>
                        <button onclick="deleteStudent('${student.studentId}')" class="text-red-600 hover:underline">Delete</button>
                    </td>
                `;
                studentTableBody.appendChild(row);
            });
        }

        // Handle Create / Update Form Submission
        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const originalId = studentIdInput.dataset.originalId || '';
            const studentData = {
                studentId: document.getElementById('studentId').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                semester: document.getElementById('semester').value,
                contact: document.getElementById('contact').value
            };

            try {
                if (originalId) {
                    // Update (using studentId route parameter)
                    await fetch(`${API_URL}/${originalId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                } else {
                    // Create
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                }
                resetForm();
                fetchStudents();
            } catch (error) {
                console.error('Error saving student:', error);
            }
        });

        function editStudent(studentId, name, email, department, semester, contact) {
            studentIdInput.value = studentId;
            studentIdInput.dataset.originalId = studentId; // Keep track for PUT route lookup
            document.getElementById('name').value = name;
            document.getElementById('email').value = email;
            document.getElementById('department').value = department;
            document.getElementById('semester').value = semester;
            document.getElementById('contact').value = contact;
            
            formTitle.textContent = 'Edit Student';
            submitBtn.textContent = 'Update Student';
            submitBtn.className = 'flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-medium';
            cancelBtn.classList.remove('hidden');
        }

        function resetForm() {
            studentForm.reset();
            studentIdInput.value = '';
            delete studentIdInput.dataset.originalId;
            studentIdInput.disabled = false;
            formTitle.textContent = 'Add New Student';
            submitBtn.textContent = 'Save Student';
            submitBtn.className = 'flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium';
            cancelBtn.classList.add('hidden');
        }

        async function deleteStudent(studentId) {
            if (confirm('Are you sure you want to delete this student?')) {
                try {
                    await fetch(`${API_URL}/${studentId}`, { method: 'DELETE' });
                    fetchStudents();
                } catch (error) {
                    console.error('Error deleting student:', error);
                }
            }
        }

        // Initial load
        fetchStudents();
    </script>
</body>
</html>
